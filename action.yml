name: Gatekeeper Security Scan
description: Fail-closed Bandit and Safety report gate with an HTML evidence artifact
author: Vu Luu
branding:
  icon: shield
  color: blue
inputs:
  requirements-file:
    description: Requirements file to scan, relative to the caller checkout
    required: false
    default: requirements.txt
runs:
  using: composite
  steps:
    - name: Run scanners
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: |
        rm -f bandit-report.json safety-report.json safety-scan.log
        test -f "$REQUIREMENTS_FILE"
        python -m pip install bandit 'safety>=3,<4'
        bandit -x .git,.venv,venv -r . -f json -o bandit-report.json || true
        safety check --file "$REQUIREMENTS_FILE" --save-json safety-report.json > safety-scan.log 2>&1 || true
    - name: Enforce security policy
      shell: bash
      run: python "$GITHUB_ACTION_PATH/security_gate.py" --bandit bandit-report.json --safety safety-report.json
    - name: Generate dashboard
      if: always()
      shell: bash
      run: python "$GITHUB_ACTION_PATH/generate_security_dashboard.py"
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-dashboard
        path: |
          security-dashboard.html
          bandit-report.json
          safety-report.json
          safety-scan.log
