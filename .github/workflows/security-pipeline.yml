name: Gatekeeper policy evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  policy-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run policy regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan the deliberately vulnerable fixture
        run: |
          python -m pip install bandit
          set +e
          bandit -r app.py -f json -o bandit-report.json
          scan_status=$?
          set -e
          test "$scan_status" -eq 1
          cp examples/safety-report.json safety-report.json
      - name: Assert that the policy blocks the fixture
        run: |
          set +e
          python security_gate.py --bandit bandit-report.json --safety safety-report.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          python generate_security_dashboard.py --sample-label 'Current Bandit scan of vulnerable app.py; synthetic Safety fixture'
      - name: Upload demonstration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-demo-evidence
          path: |
            bandit-report.json
            safety-report.json
            security-dashboard.html

  full-scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run authenticated scanners through the reusable action
        uses: ./
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        with:
          requirements-file: requirements.txt
